name: Release gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mejoras-pendientes-20260826

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  onprem-package:
    name: On-premise package and recovery smoke
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked application dependencies
        run: |
          python -m pip install --disable-pip-version-check poetry==2.4.1
          poetry install --sync --no-interaction
      - name: Verify package contracts without containers
        run: poetry run deployment/onprem/scripts/verify-package.sh
      - name: Build, restart, backup and restore the isolated package
        env:
          ONPREM_DEPLOYMENT_MODE: evaluation
          ONPREM_SMOKE_MODE: evaluation
          AUTH_ENFORCEMENT: staging
          BACKUP_ENCRYPTION_REQUIRED: "true"
        run: poetry run deployment/onprem/scripts/smoke-test.sh

  certify:
    if: github.ref == 'refs/heads/codex/mejoras-pendientes-20260826'
    needs:
      - security
      - onprem-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --sync --no-interaction
      - name: Validate package and release configuration
        run: |
          poetry check
          poetry run python -m py_compile app_validacion.py persistence/neon_store.py pipeline/homologation_pipeline.py
          git diff --check
      - name: Run complete test suite
        run: |
          poetry run python scripts/pytest_collection_gate.py
          poetry run pytest -q
      - name: Validate private recertification contracts
        run: |
          poetry run python - <<'PY'
          from pathlib import Path
          from scripts.certify_local_corpus import load_manifest

          for path in (
              Path("tests/fixtures/private_release_matrix.json"),
              Path("tests/fixtures/private_gold_candidate_matrix.json"),
          ):
              cases = load_manifest(path)
              required = sum(
                  bool(case.get("required_for_release", True))
                  for case in cases
              )
              print(f"{path}: {required} caso(s) obligatorio(s) validados")
          PY
      - name: Require Neon secret
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: test -n "$DATABASE_URL"
      - name: Verify Neon and pipeline knowledge
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: poetry run python scripts/neon_preflight.py
      - name: Require Render deployment secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
      - name: Ensure certified commit is current branch head
        run: |
          git fetch origin "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Verify signed private corpus recertification
        env:
          PRIVATE_RELEASE_ATTESTATION_B64: ${{ secrets.PRIVATE_RELEASE_ATTESTATION_B64 }}
          PRIVATE_RELEASE_ATTESTATION_PUBLIC_KEY_B64: ${{ secrets.PRIVATE_RELEASE_ATTESTATION_PUBLIC_KEY_B64 }}
        run: |
          test -n "$PRIVATE_RELEASE_ATTESTATION_B64"
          test -n "$PRIVATE_RELEASE_ATTESTATION_PUBLIC_KEY_B64"
          printf '%s' "$PRIVATE_RELEASE_ATTESTATION_B64" | base64 --decode > "$RUNNER_TEMP/private-release-attestation.json"
          printf '%s' "$PRIVATE_RELEASE_ATTESTATION_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private-release-public.pem"
          poetry run python scripts/release_attestation.py verify \
            --attestation "$RUNNER_TEMP/private-release-attestation.json" \
            --public-key "$RUNNER_TEMP/private-release-public.pem" \
            --commit "$GITHUB_SHA" \
            --manifest tests/fixtures/private_release_matrix.json \
            --manifest tests/fixtures/private_gold_candidate_matrix.json
      - name: Record certified commit
        run: echo "CERTIFIED_COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck branch head immediately before deployment
        run: |
          git fetch origin "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Deploy exact certified commit to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: poetry run python scripts/deploy_certified_render.py
      - name: Record verified deployment
        run: echo "DEPLOYED_COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
